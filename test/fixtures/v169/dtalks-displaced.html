<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디톡스 합성 편성표</title></head><body>
<style>.calendar_grid,.day_wrap{display:grid;grid-template-columns:repeat(5,120px)}.calendar_grid>.day{height:190px}.day_txt{display:block;margin:0;height:24px}.day_box{box-sizing:border-box;width:110px;height:64px}.day_box p{margin:0}.displaced{transform:translateX(360px)}</style><main class="calendar_wrap"><div class="btn_month_wrap active"><span class="date">2026.11</span></div><div class="calendar_box active"><div class="day_wrap"><div class="day">월</div><div class="day">화</div><div class="day">수</div><div class="day">목</div><div class="day">금</div></div><div class="calendar_grid"><div class="day"><p class="day_txt">23일</p><article class="day_box"><p class="time">13:00</p><p class="memo">시험 점심 강의 0</p><button>사전신청완료</button></article><article class="day_box displaced"><p class="time">18:00</p><p class="memo">시험 저녁 강의</p><button>사전신청완료</button></article></div><div class="day"><p class="day_txt">24일</p><article class="day_box"><p class="time">13:00</p><p class="memo">시험 점심 강의 1</p><button>사전신청완료</button></article></div><div class="day"><p class="day_txt">25일</p><article class="day_box"><p class="time">13:00</p><p class="memo">시험 점심 강의 2</p><button>사전신청완료</button></article></div><div class="day"><p class="day_txt">26일</p><article class="day_box"><p class="time">13:00</p><p class="memo">시험 점심 강의 3</p><button>사전신청완료</button></article></div><div class="day"><p class="day_txt">27일</p><article class="day_box"><p class="time">13:00</p><p class="memo">시험 점심 강의 4</p><button>사전신청완료</button></article></div></div></div></main>
<script>window.fixtureActions = { buttonClicks: 0 }; document.addEventListener('click', event => { if (event.target.closest('button')) window.fixtureActions.buttonClicks++; });</script>
</body></html>
