name: Manual source checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
